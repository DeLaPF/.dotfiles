[tools]
node = "24.19.0"
python = "3.12.12"
uv = "0.12.6"
pnpm = "11.1.2"
"npm:typescript" = "6.0.3"

starship = "1.24.2"
typst = "0.15.1"
rg = "15.1.0"
fzf = "0.67.0"
bat = "0.26.1"
gh = "2.89.0"
bob = "4.1.6"
tree-sitter = "0.27.0"
atuin = "18.22.0"

# Intentionally unpinned globally until needed: java, go, zig, and zls.
# Bob remains the Neovim owner because it supports source builds.

[vars]
# Dotfile-managed plugins are pinned separately from Mise-managed executables.
zsh_syntax_highlighting_ref = "5eb677bb0fa9a3e60f0eff031dc13926e093df92"
tpm_ref = "99469c4a9b1ccf77fade25842dc7bafbc8ce9946"
tmux_prefix_highlight_ref = "06cbb4ecd3a0a918ce355c70dc56d79debd455c7"
tmux_resurrect_ref = "cff343cf9e81983d3da0c8562b01616f12e8d548"
tmux_continuum_ref = "0698e8f4b17d6454c71bf5212895ec055c578da0"

[settings]
# Installation should be deliberate, especially in agent and CI shells.
not_found_auto_install = false

[settings.npm]
# Preserve the conventional global layout expected by typescript-tools.nvim.
package_manager = "npm"

[tasks."dotfiles:setup"]
description = "Finish dotfile setup"
depends = ["dotfiles:git-config", "dotfiles:zsh-plugins", "dotfiles:tmux-plugins"]

[tasks."dotfiles:git-config"]
description = "Reserve ~/.gitconfig for machine-specific global settings"
run = '''
set -eu
config="$HOME/.gitconfig"

if [ -e "$config" ]; then
  if [ ! -f "$config" ]; then
    echo "Refusing non-file Git config path: $config" >&2
    exit 1
  fi
elif [ -L "$config" ]; then
  echo "Refusing broken Git config symlink: $config" >&2
  exit 1
else
  touch "$config"
fi
'''

[tasks."dotfiles:zsh-plugins"]
description = "Install zsh-syntax-highlighting"
run = '''
set -eu
destination="$HOME/.zsh/plugins/zsh-syntax-highlighting"
ref="{{ vars.zsh_syntax_highlighting_ref }}"

if [ ! -d "$destination/.git" ]; then
  if [ -e "$destination" ]; then
    echo "Refusing to replace non-git path: $destination" >&2
    exit 1
  fi
  mkdir -p "${destination%/*}"
  git clone --depth 1 https://github.com/zsh-users/zsh-syntax-highlighting.git "$destination"
fi

if [ "$(git -C "$destination" rev-parse HEAD)" != "$ref" ]; then
  git -C "$destination" fetch --depth 1 origin "$ref"
  git -C "$destination" checkout --detach "$ref"
fi
'''

[tasks."dotfiles:tmux-plugins"]
description = "Install TPM and the plugins declared in ~/.tmux.conf"
run = '''
set -eu
destination="$HOME/.tmux/plugins/tpm"

pin_repo() {
  repo="$1"
  ref="$2"
  if [ "$(git -C "$repo" rev-parse HEAD)" != "$ref" ]; then
    git -C "$repo" fetch --depth 1 origin "$ref"
    git -C "$repo" checkout --detach "$ref"
  fi
}

if [ ! -d "$destination/.git" ]; then
  if [ -e "$destination" ]; then
    echo "Refusing to replace non-git path: $destination" >&2
    exit 1
  fi
  mkdir -p "${destination%/*}"
  git clone --depth 1 https://github.com/tmux-plugins/tpm "$destination"
fi

pin_repo "$destination" "{{ vars.tpm_ref }}"
"$destination/bin/install_plugins"
pin_repo "$HOME/.tmux/plugins/tmux-prefix-highlight" "{{ vars.tmux_prefix_highlight_ref }}"
pin_repo "$HOME/.tmux/plugins/tmux-resurrect" "{{ vars.tmux_resurrect_ref }}"
pin_repo "$HOME/.tmux/plugins/tmux-continuum" "{{ vars.tmux_continuum_ref }}"
'''
