# History stays local; Mise handles Atuin updates.
auto_sync = false
update_check = false

# The standard search widget uses global fuzzy history. The shell up-search
# profile powers normal-mode / with pane-local history.
search_mode = "fuzzy"
filter_mode = "global"
search_mode_shell_up_key_binding = "fuzzy"
filter_mode_shell_up_key_binding = "session-preload"

workspaces = true
keymap_mode = "vim-normal"
enter_accept = false

style = "compact"
inline_height = 30
inline_height_shell_up_key_binding = 10

[search]
filters = ["global", "workspace", "directory", "session"]

[keymap.vim-insert]
"j k" = "vim-enter-normal"
"esc" = "return-original"

[keymap.vim-normal]
"q" = "return-original"
"s" = [
  { when = "has-context", action = "clear-context" },
  { action = "switch-context" },
]

[tmux]
enabled = true
width = "80%"
height = "60%"
